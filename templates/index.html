<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroAlert</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="logo">⬡ ASTROALERT</div>
      <div class="location">Quito, Ecuador</div>
    </header>

    <!-- LOGIN -->
    <div id="login-panel" class="panel">
      <input type="email" id="email" placeholder="tu@email.com">
      <input type="password" id="password" placeholder="Contraseña">
      <button onclick="login()">Entrar</button>
      <button class="secondary" onclick="registro()">Crear cuenta</button>
      <p id="auth-error" class="error"></p>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="main-panel" class="panel hidden">

      <!-- NAVEGACIÓN -->
      <nav class="nav">
        <button class="nav-btn active" onclick="ir('iss')">🛸 ISS</button>
        <button class="nav-btn" onclick="ir('planetas')">🪐 Planetas</button>
        <button class="nav-btn" onclick="ir('eclipses')">🌑 Eclipses</button>
        <button class="nav-btn" onclick="ir('lunas')">🌙 Lunas</button>
        <button class="nav-btn" onclick="ir('conjunciones')">✨ Conjunciones</button>
      </nav>

      <!-- SECCIÓN ISS -->
      <div id="sec-iss" class="seccion">
        <div class="card">
          <div class="card-label">🛸 ISS AHORA</div>
          <div id="iss-data" class="loading">Cargando...</div>
        </div>
      </div>

      <!-- SECCIÓN PLANETAS -->
      <div id="sec-planetas" class="seccion hidden">
        <div class="card">
          <div class="card-label">🪐 PLANETAS VISIBLES</div>
          <div id="planetas-data" class="loading">Cargando...</div>
        </div>
      </div>

      <!-- SECCIÓN ECLIPSES -->
      <div id="sec-eclipses" class="seccion hidden">
        <div class="card">
          <div class="card-label">🌑 PRÓXIMO ECLIPSE</div>
          <div id="eclipses-data" class="loading">Cargando...</div>
        </div>
      </div>

      <!-- SECCIÓN CONJUNCIONES -->
      <div id="sec-conjunciones" class="seccion hidden">
        <div class="card">
          <div class="card-label">✨ CONJUNCIONES PLANETARIAS</div>
          <div id="conjunciones-data" class="loading">Cargando...</div>
        </div>
      </div>

      <!-- SECCIÓN LUNAS -->
    <div id="sec-lunas" class="seccion hidden">
      <div class="lunas-container">
        <div class="lunas-lista" id="lunas-lista"></div>
        <div class="luna-detalle" id="luna-detalle">
          <div class="card-sub" style="text-align:center;padding:20px">
            Selecciona una luna para ver su información
          </div>
        </div>
      </div>
     </div>
    </div>

      <button class="secondary" style="margin-top:12px" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
