<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroAlert</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="logo">⬡ ASTROALERT</div>
      <div class="location">Quito, Ecuador</div>
    </header>

    <div id="login-panel" class="panel">
      <h2>Iniciar sesión</h2>
      <input type="email" id="email" placeholder="tu@email.com">
      <input type="password" id="password" placeholder="Contraseña">
      <button onclick="login()">Entrar</button>
      <button class="secondary" onclick="registro()">Crear cuenta</button>
      <p id="auth-error" class="error"></p>
    </div>

    <div id="main-panel" class="panel hidden">
      <div id="iss-card" class="card">
        <div class="card-label">🛸 ISS AHORA</div>
        <div id="iss-data" class="loading">Cargando...</div>
      </div>

      <div id="planetas-card" class="card">
        <div class="card-label">🪐 PLANETAS</div>
        <div id="planetas-data" class="loading">Cargando...</div>
      </div>

      <button class="secondary" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
